name: Vendor SheetJS browser build

on:
  push:
    branches:
      - security-hardening
    paths:
      - .github/workflows/vendor-sheetjs.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  vendor:
    if: github.ref == 'refs/heads/security-hardening'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out security-hardening
        uses: actions/checkout@v4
        with:
          ref: security-hardening
          fetch-depth: 0

      - name: Download and verify official SheetJS 0.20.3 release
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/xlsx-0.20.3.tgz"
          extract="$RUNNER_TEMP/xlsx-release"
          expected_sha512='oLDq3jw7AcLqKWH2AhCpVTZl8mf6X2YReP+Neh0SJUzV/BdZYjth94tG5toiMB1PPrYtxOCfaoUCkvtuH+3AJA=='

          curl --fail --location --silent --show-error --retry 3 --retry-all-errors \
            --proto '=https' --tlsv1.2 \
            'https://cdn.sheetjs.com/xlsx-0.20.3/xlsx-0.20.3.tgz' \
            --output "$archive"

          actual_sha512="$(openssl dgst -sha512 -binary "$archive" | openssl base64 -A)"
          if [[ "$actual_sha512" != "$expected_sha512" ]]; then
            echo "::error::SheetJS release archive SHA-512 mismatch"
            exit 1
          fi

          mkdir -p "$extract"
          tar -xzf "$archive" -C "$extract"
          node -e "const p=require(process.argv[1]); if(p.version!=='0.20.3') process.exit(1)" \
            "$extract/package/package.json"
          test -s "$extract/package/dist/xlsx.full.min.js"

          install -m 0644 "$extract/package/dist/xlsx.full.min.js" \
            Frontend/src/main/resources/static/js/xlsx.full.min.js
          (
            cd Frontend/src/main/resources/static/js
            sha512sum xlsx.full.min.js > xlsx.full.min.js.sha512
          )

      - name: Commit verified vendored asset
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Frontend/src/main/resources/static/js/xlsx.full.min.js \
            Frontend/src/main/resources/static/js/xlsx.full.min.js.sha512
          if git diff --cached --quiet; then
            echo 'Vendored SheetJS is already current.'
            exit 0
          fi
          git commit -m 'Upgrade vendored SheetJS to 0.20.3'
          git push origin HEAD:security-hardening
