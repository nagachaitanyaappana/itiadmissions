name: ITI Admissions CI

on:
  push:
    branches:
      - ui-experiment
  pull_request:
    branches:
      - ui-experiment
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend-checks:
    name: Frontend tests and WAR build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 26

      - name: Run JavaScript unit tests
        working-directory: Frontend
        run: npm test

      - name: Set up Java 22
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '22'
          cache: maven
          cache-dependency-path: Frontend/pom.xml

      - name: Build frontend WAR
        run: ./mvnw -B -DskipTests package
        working-directory: Frontend
