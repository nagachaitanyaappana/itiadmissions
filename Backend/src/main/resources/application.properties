# ── Local overrides (untracked) ──────────────────────────────────────────
# Copy .env.example to .env and put YOUR OWN values there. Never commit .env.
# Spring Boot loads .env automatically via `spring.config.import` below, so
# `export` is not needed when running from this directory.
spring.config.import=optional:file:.env[.properties]

spring.application.name=backend

# Shared only by the Frontend and Backend server processes. Set the same
# random value (at least 32 characters) as INTERNAL_API_SECRET in both .env
# files. Never expose this value to browser JavaScript or commit it.
app.internal-auth.secret=${INTERNAL_API_SECRET:}
# Base64-encoded random 256-bit key for official-user JWTs.
app.jwt.secret=${APP_JWT_SECRET:}
app.jwt.issuer=itiadmissions
# Admissions Backend runs on 6050 by default so it can run alongside the
# combined Backend (5050). Override with SERVER_PORT in .env.
server.port=${SERVER_PORT:5050}

# Distinct session cookie name. The Frontend and Backend both run on
# localhost, and cookies are keyed by host (not port), so sharing the default
# "JSESSIONID" made the Backend overwrite the Frontend's session cookie on
# every browser call that touched the Backend session (e.g. /api/student/register,
# /api/meritlist/generate). That silently logged officials out mid-flow
# ("Please login to continue."). A unique name keeps the two sessions separate.
server.servlet.session.cookie.name=ITIAP_BACKEND_SESSION
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/itiaplocal}
spring.datasource.username=${DB_USERNAME:postgres}
# The password is not in this tracked file. Backend/.env carries it locally (gitignored) and
# Spring loads it through spring.config.import above; in CI and production set the DB_PASSWORD
# environment variable instead. The old literal default is gone from HEAD, but it survives in git
# history, so rotating the credential is still outstanding - see WRONG_IMPLEMENTATIONS.md Issue 7.
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP tuning
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
logging.level.org.hibernate.SQL=OFF
logging.level.org.hibernate.orm.jdbc.bind=OFF

# Swagger / OpenAPI configuration
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger
springdoc.swagger-ui.operationsSorter=alpha
springdoc.swagger-ui.tagsSorter=alpha

# Swagger UI ships a default "url" pointing at petstore.swagger.io inside
# swagger-initializer.js. When that url is present, Swagger UI loads it instead
# of rendering the module group dropdown produced by our GroupedOpenApi beans.
# Disabling it makes configUrl (/v3/api-docs/swagger-config) the only source,
# so the module selector (ITI, Admission Process, Student, ...) is used.
springdoc.swagger-ui.disable-swagger-default-url=true

# Open Swagger UI on the "All Modules" group instead of the alphabetically
# first one ("Admission Process"). That way every module section (ITI,
# Admission Process, Student, Merit & Checklist, ...) is visible on the page
# without having to pick it from the "Select a definition" dropdown first.
springdoc.swagger-ui.urls-primary-name=All Modules
spring.jpa.open-in-view=false

# Where a browser UI is allowed to call this API from (CORS).
# The fallback is restricted to known local development UI origins. Production
# deployments must set CORS_ALLOWED_ORIGINS to the exact HTTPS UI origin(s).
# Do not use "*" with credentials: it effectively trusts every website.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5051,http://127.0.0.1:5051,http://localhost:6051,http://127.0.0.1:6051,http://localhost:8080,http://localhost:8081}

# Candidate photograph upload (StudentApply.jsp step 2 -> /api/student/photo/{regid}).
# Legacy accepted image/png / image/jpeg only; 5MB per file is generous for a passport photo.
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

