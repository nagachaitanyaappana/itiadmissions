# ── Local overrides (untracked) ──────────────────────────────────────────
# Copy .env.example to .env and put YOUR OWN values there. Never commit .env.
# Spring Boot loads .env automatically via `spring.config.import` below.
spring.config.import=optional:file:.env[.properties]

spring.application.name=frontend

# Single backend base URL — all frontend modules use this to reach the Backend
backend.api.base-url=${BACKEND_URL:http://localhost:5050}

# Frontend Server
# Admissions Frontend runs on 6051 by default so it can run alongside the
# combined Frontend (5051). Override with SERVER_PORT in .env.
server.port=${SERVER_PORT:5051}

# JSP Configuration
spring.mvc.view.prefix=/WEB-INF/

spring.mvc.view.suffix=.jsp

# Logging: avoid verbose request/debug output in normal runs.
logging.level.org.springframework.web=INFO
logging.level.com.server.frontend=INFO
spring.devtools.add-properties=false

# Session cookie protections. Set SESSION_COOKIE_SECURE=true behind HTTPS in production.
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}

# Developer-only captcha bypass; never enable in a public deployment.
app.auth.dev-login-enabled=${DEV_LOGIN_ENABLED:false}
